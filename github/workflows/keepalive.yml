name: Supabase keep-alive

# Free-tier projects pause after about a week with no activity. This makes a tiny read
# every 3 days. (GitHub disables scheduled workflows in repos with no commits for 60 days;
# if that happens, re-enable it under the Actions tab.)
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --max-time 30 \
            "$URL/rest/v1/public_samples?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo
